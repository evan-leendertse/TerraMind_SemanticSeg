defaults:
  - paths: base
  - model: base

writer:
  base_dir: test_output
  test_name: "test1"

hydra:
  mode: MULTIRUN
  sweep:
    dir: ${writer.base_dir}/${writer.test_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  output_subdir: null
  sweeper:
    params:
      paths.trained_model: multirun/Initial2/2025-11-10/23-30-43/33/checkpoints/best_model_epoch7_valloss0.5708.pt, multirun/Initial2/2025-11-10/23-30-43/30/checkpoints/best_model_epoch8_valloss0.1486.pt, multirun/Initial2/2025-11-10/23-30-43/41/checkpoints/best_model_epoch67_valloss0.6293.pt
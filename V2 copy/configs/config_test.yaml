hydra:
  mode: RUN
  run:
    dir: ${writer.base_dir}/${writer.test_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

paths_:
  modalities:
    S2L2A: 
      before: Images_large/Test/Before/S2L2A 
      after: Images_large/Test/After/S2L2A
    S1GRD: 
      before: Images_large/Test/Before/S1GRD/DESC
      after: Images_large/Test/After/S1GRD/DESC
  label_dir: Images_large/Test/Labels
  trained_model: multirun/Initial3/2025-11-10/01-10-07/1/checkpoints/best_model_epoch1_valloss0.3329.pt
  copy_configs: multirun/Initial3/2025-11-10/01-10-07/1/checkpoints/best_config_epoch1_valloss0.3329.yaml

model:
  patch_size: 224
  stride: 224
  version: "terramind_v1_base"
  num_classes: 3
  pretrained: true
  ignore_index: 0
  num_workers: 0

writer:
  base_dir: test_output
  test_name: "test1"